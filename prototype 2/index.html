<!DOCTYPE html>
<html>
<head>
  <title>Live Carbon Emission Map with AQI and Heatmap</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-heat/dist/leaflet-heat.css" />
  <style>
    #map {
      height: 500px;
      width: 100%;
    }
    body, html {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    input {
      margin: 10px;
      padding: 5px;
    }
  </style>
</head>
<body>
  <h1>Live Carbon Emission Map with AQI and Heatmap</h1>
  <input type="text" id="locationInput" placeholder="Enter location (e.g., city, country)" />
  <button onclick="fetchLocation()">Show Carbon Emission</button>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-heat/dist/leaflet-heat.js"></script>
  <script>
    const apiKey = '9cfe2efc8f363de323a83be47767974df1135754';
    const map = L.map('map').setView([51.505, -0.09], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    let heatLayer;
    let markers = [];

    function fetchLocation() {
      const location = document.getElementById('locationInput').value;
      if (location) {
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${location}`)
          .then(response => response.json())
          .then(data => {
            if (data.length > 0) {
              const lat = data[0].lat;
              const lon = data[0].lon;
              map.setView([lat, lon], 10);

              fetchCarbonEmission(lat, lon);
            } else {
              alert('Location not found');
            }
          })
          .catch(error => {
            console.error('Error fetching location:', error);
          });
      } else {
        alert('Please enter a location');
      }
    }

    function fetchCarbonEmission(lat, lon) {
      fetch(`https://api.waqi.info/feed/geo:${lat};${lon}/?token=${apiKey}`)
        .then(response => response.json())
        .then(data => {
          if (data.status === 'ok') {
            const aqi = data.data.aqi;
            const intensity = aqi / 300; // Normalize AQI for heatmap

            // Remove old heatmap layer if it exists
            if (heatLayer) {
              map.removeLayer(heatLayer);
            }

            // Add new heatmap layer
            heatLayer = L.heatLayer([[lat, lon, intensity]], { radius: 25 }).addTo(map);

            // Remove old markers
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            // Add a new marker
            const markerColor = getMarkerColor(aqi);
            const marker = L.marker([lat, lon], {
              icon: L.divIcon({
                className: 'custom-icon',
                html: `<div style="background-color: ${markerColor}; width: 10px; height: 10px; border-radius: 50%;"></div>`
              })
            }).addTo(map);

            marker.bindPopup(`Carbon Emission (AQI): ${aqi}`).openPopup();
            markers.push(marker);
          } else {
            alert('No carbon emission data available for this location');
          }
        })
        .catch(error => {
          console.error('Error fetching carbon emission data:', error);
        });
    }

    function getMarkerColor(aqi) {
      if (aqi <= 50) return 'green';
      if (aqi <= 100) return 'yellow';
      if (aqi <= 150) return 'orange';
      if (aqi <= 200) return 'red';
      if (aqi <= 300) return 'purple';
      return 'maroon';
    }
  </script>
</body>
</html>
